<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930"><rect width="1400" height="930" fill="#FAFBF9"/><text x="65" y="76" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="34" font-weight="600" fill="#172B2A">Shelter / ShelterType</text><text x="65" y="117" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="600" fill="#657672">品牌标志与应用标志</text><rect x="65" y="164" width="610" height="630" rx="24" fill="#EFF3F0"/><text x="97" y="211" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="600" fill="#172B2A">浅色背景版本</text><g transform="translate(93 250) scale(.65)"><path d="M128 28L32 84L128 140Z" fill="#172B2A"/><path d="M128 116L224 172L128 228Z" fill="#67CBB0"/></g><text x="284" y="327" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="48" font-weight="600" fill="#172B2A">Shelter</text><text x="284" y="369" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600" fill="#172B2A">独立品牌 / 跨项目使用</text><path d="M97 459h546" stroke="#172B2A" opacity=".18"/><g transform="translate(93 511) scale(.65)"><rect x="25" y="25" width="206" height="206" rx="37" fill="none" stroke="#172B2A" stroke-width="12"/><g transform="translate(39 25) scale(.695)"><path d="M128 28L32 84L128 140Z" fill="#67CBB0"/><path d="M128 116L224 172L128 228Z" fill="#67CBB0"/></g><path d="M97 202h62" stroke="#172B2A" stroke-width="9" stroke-linecap="round"/></g><text x="284" y="587" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="43" font-weight="600" fill="#172B2A">ShelterType</text><text x="284" y="629" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600" fill="#172B2A">打字应用 / 键帽标志</text><text x="97" y="751" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600" fill="#172B2A">两套共用同一个 S，保持品牌关联。</text><rect x="740" y="164" width="610" height="630" rx="24" fill="#172B2A"/><text x="772" y="211" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="600" fill="#D8F1E9">深色背景版本</text><g transform="translate(768 250) scale(.65)"><path d="M128 28L32 84L128 140Z" fill="#D8F1E9"/><path d="M128 116L224 172L128 228Z" fill="#67CBB0"/></g><text x="959" y="327" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="48" font-weight="600" fill="#D8F1E9">Shelter</text><text x="959" y="369" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600" fill="#D8F1E9">独立品牌 / 跨项目使用</text><path d="M772 459h546" stroke="#D8F1E9" opacity=".18"/><g transform="translate(768 511) scale(.65)"><rect x="25" y="25" width="206" height="206" rx="37" fill="none" stroke="#D8F1E9" stroke-width="12"/><g transform="translate(39 25) scale(.695)"><path d="M128 28L32 84L128 140Z" fill="#67CBB0"/><path d="M128 116L224 172L128 228Z" fill="#67CBB0"/></g><path d="M97 202h62" stroke="#D8F1E9" stroke-width="9" stroke-linecap="round"/></g><text x="959" y="587" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="43" font-weight="600" fill="#D8F1E9">ShelterType</text><text x="959" y="629" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600" fill="#D8F1E9">打字应用 / 键帽标志</text><text x="772" y="751" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600" fill="#D8F1E9">两套共用同一个 S，保持品牌关联。</text><text x="65" y="854" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="20" font-weight="600" fill="#172B2A">图形可单独使用；带名称组合适合首页、关于页面、发布资料。</text><text x="65" y="891" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600" fill="#657672">SVG 与 PNG 均提供透明背景。深浅版本指使用背景，名称保持 ShelterType。</text></svg>